name: ci
on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # an end-to-end build: compiles in the test-only switches (apps/web/src/lib/e2e.ts). Turborepo hashes
    # NEXT_PUBLIC_* for `build`, so this build is never replayed as a production one. Deployments do not set it.
    env:
      NEXT_PUBLIC_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # registry signatures of every installed package
      - run: npm audit signatures
      # the lockfile must keep the Linux binaries Velocity needs (guards against a damaged lockfile)
      - run: grep -q '"node_modules/@next/swc-linux-x64-gnu"' package-lock.json
      # and the resvg binary the build renders the sharing images with (src/lib/og-card.tsx)
      - run: grep -q '"node_modules/@resvg/resvg-js-linux-x64-gnu"' package-lock.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm exec -w apps/web -- playwright install --with-deps chromium
      # every spec except the @visual snapshots, which need the Playwright image (job `visual`)
      - run: npm run e2e
      # the shipped build, without the test switches; a separate Turborepo hash, so it never reuses the one above
      - name: production build
        run: npm run build
        env:
          NEXT_PUBLIC_E2E: ""
      # route JS of / and /ar (index.html, ar.html) at most 170 kB gzip, and no zod in it (spec line 32)
      - run: node apps/web/scripts/check-bundle.mjs
      # Lighthouse on / and /ar (apps/web/lighthouserc.json). The runner has no GPU, so the background is the CSS
      # fallback there (docs/DEPLOY.md, "Lighthouse"). Owner decision 2026-10-17: LCP (both pages) and /ar performance
      # only warn, because the lab simulation counts the fonts and scripts requested before the first paint; real-visitor
      # LCP after launch is the real test. Every other gate fails the job at its threshold.
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=apps/web/lighthouserc.json
        env:
          NEXT_PUBLIC_E2E: ""
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .lighthouseci
  # The static mode Cloudflare Pages serves (owner decision 2026-10-18): the production export in apps/web/out/, its
  # route JS, and the focused suite (apps/web/e2e-static/) against `wrangler pages dev`, which applies out/_headers and
  # out/_redirects as Pages does. The full suite stays on `next start` (job `check`).
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the binaries the static build and its server need: sharp encodes the screenshots
      # (apps/web/scripts/screenshots.mjs), workerd runs `wrangler pages dev`
      - run: grep -q '"node_modules/@img/sharp-linux-x64"' package-lock.json
      - run: grep -q '"node_modules/@cloudflare/workerd-linux-64"' package-lock.json
      # the build Pages runs, without the test switches
      - run: npm run build:static
      # route JS of out/index.html and out/ar.html at most 170 kB gzip, and no zod in it (spec line 32)
      - run: node apps/web/scripts/check-bundle.mjs --static
      - run: npm exec -w apps/web -- playwright install --with-deps chromium
      - run: npm run e2e:static -w web
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: static-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
  # Visual snapshots compare only inside the Playwright image of the installed @playwright/test version: font
  # rendering differs between systems. Baselines are made locally with `npm run e2e:visual -w web -- --update-snapshots`
  # in the same image and committed; this job never updates them.
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    env:
      NEXT_PUBLIC_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --grep @visual --update-snapshots=none
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: visual-diffs
          path: |
            apps/web/playwright-report
            apps/web/test-results
